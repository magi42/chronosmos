{% extends 'base.html' %}
{% block page %}viewer{% endblock %}
{% block body %}
<header class="public-header viewer-header">
  <a class="brand" href="/" aria-label="Chronosmos"><span class="brand-mark">C</span>Chronosmos</a>
  <div class="viewer-heading"><a href="/" class="back-link" data-i18n="allTimelines">← All timelines</a><h1 id="viewer-title"></h1><p id="viewer-description" hidden></p></div>
  <div class="header-right"><button class="language">FI</button><button id="export-open" class="secondary" data-i18n="export">Export</button></div>
</header>
<main id="viewer" data-timeline-id="{{ timeline_id }}"><div class="viewer-tools"><span id="viewer-range" class="eyebrow"></span><div class="zoom-controls"><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-value">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-fit" data-i18n="fit">Fit</button></div></div><div id="canvas-viewport" class="canvas-viewport public-canvas"><div id="canvas"></div></div><p class="screen-scale-note" data-i18n="screenZoomHint">100% fits the available width. Print size is set separately.</p><p class="viewer-hint" data-i18n="viewerHint">Drag to pan · Click text or graphics to enlarge · Ctrl + scroll to zoom</p></main>
<details id="viewer-sources" class="viewer-sources" hidden><summary data-i18n="dateSources">Date notes and sources</summary><div></div></details>
<dialog id="export-dialog"></dialog>
{% endblock %}
