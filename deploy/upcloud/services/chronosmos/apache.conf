<VirtualHost *:80>
    ServerName chronosmos.magi.fi
    DocumentRoot /var/www/letsencrypt
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://chronosmos.magi.fi%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
<VirtualHost *:443>
    ServerName chronosmos.magi.fi
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/chronosmos.magi.fi/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chronosmos.magi.fi/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8020/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:8020/
    LimitRequestBody 12582912
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    ErrorLog ${APACHE_LOG_DIR}/chronosmos-error.log
    CustomLog ${APACHE_LOG_DIR}/chronosmos-access.log combined
</VirtualHost>
